<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HVS - iPhone 14 Preview</title>
  <style>
    :root {
      --page-bg: #e9ebef;
      --frame: #1c1c1e;
      --frame-edge: #3a3a3c;
      --button: #2c2c2e;
      --screen-w: 390px;
      --screen-h: 844px;
      --bezel: 6px;
      --radius: 53px;
      --status-h: 47px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--page-bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    .stage {
      transform-origin: center center;
    }

    /* ---------- device body ---------- */
    .phone {
      position: relative;
      width: calc(var(--screen-w) + var(--bezel) * 2);
      height: calc(var(--screen-h) + var(--bezel) * 2);
      padding: var(--bezel);
      border-radius: var(--radius);
      background: var(--frame);
      box-shadow:
        0 0 0 1px var(--frame-edge),
        0 20px 40px rgba(0, 0, 0, 0.14),
        0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .btn {
      position: absolute;
      width: 3px;
      background: var(--button);
    }

    .btn.left {
      left: -3px;
      border-radius: 2px 0 0 2px;
    }

    .btn.right {
      right: -3px;
      border-radius: 0 2px 2px 0;
    }

    .btn.silent { top: 150px; height: 32px; }
    .btn.vol-up { top: 208px; height: 62px; }
    .btn.vol-down { top: 282px; height: 62px; }
    .btn.power { top: 236px; height: 100px; }

    /* ---------- screen ---------- */
    .screen {
      position: relative;
      width: var(--screen-w);
      height: var(--screen-h);
      overflow: hidden;
      border-radius: calc(var(--radius) - var(--bezel));
      background: #fff;
    }

    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      z-index: 3;
      width: 162px;
      height: 33px;
      transform: translateX(-50%);
      background: var(--frame);
      border-radius: 0 0 20px 20px;
    }

    .notch::before,
    .notch::after {
      content: "";
      position: absolute;
      top: 0;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle at 0 100%, transparent 7.5px, var(--frame) 8px);
    }

    .notch::before { left: -8px; }

    .notch::after {
      right: -8px;
      transform: scaleX(-1);
    }

    .speaker {
      position: absolute;
      top: 8px;
      left: 50%;
      width: 44px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 3px;
      background: #0b0b0c;
    }

    .camera {
      position: absolute;
      top: 6px;
      right: 34px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2a3550 0 2px, #0b0b0c 3px);
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      height: var(--status-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 30px 0 34px;
      background: #f5f5f5;
      color: #000;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icons svg {
      display: block;
    }

    .app {
      position: absolute;
      top: var(--status-h);
      left: 0;
      width: var(--screen-w);
      height: calc(var(--screen-h) - var(--status-h));
      border: 0;
      background: #fff;
    }

    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      z-index: 2;
      width: 134px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 3px;
      background: #000;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <div class="phone" role="img" aria-label="iPhone 14 preview">
      <span class="btn left silent"></span>
      <span class="btn left vol-up"></span>
      <span class="btn left vol-down"></span>
      <span class="btn right power"></span>

      <div class="screen">
        <div class="notch"><span class="speaker"></span><span class="camera"></span></div>

        <div class="status-bar">
          <span id="clock">9:41</span>
          <span class="status-icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="#000">
              <rect x="0" y="8" width="3" height="4" rx="1" />
              <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
              <rect x="10" y="3" width="3" height="9" rx="1" />
              <rect x="15" y="0" width="3" height="12" rx="1" />
            </svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="#000">
              <path d="M8 2.4c2.3 0 4.4.9 6 2.4l1.3-1.3C13.4 1.6 10.8.5 8 .5S2.6 1.6.7 3.5L2 4.8c1.6-1.5 3.7-2.4 6-2.4z" />
              <path d="M8 5.9c1.3 0 2.5.5 3.5 1.3l1.3-1.3C11.5 4.7 9.8 4 8 4s-3.5.7-4.8 1.9l1.3 1.3c1-.8 2.2-1.3 3.5-1.3z" />
              <path d="M8 9.3c.4 0 .8.1 1.1.4L8 11.5 6.9 9.7c.3-.3.7-.4 1.1-.4z" />
            </svg>
            <svg width="27" height="13" viewBox="0 0 27 13">
              <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4" />
              <rect x="2" y="2" width="20" height="9" rx="2" fill="#000" />
              <path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#000" fill-opacity="0.4" />
            </svg>
          </span>
        </div>

        <iframe class="app" id="app" src="index.html" title="HVS app"></iframe>
        <span class="home-indicator"></span>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const app = document.getElementById('app');
    const clock = document.getElementById('clock');

    // Fit the whole device in the window, never upscaling past 1:1.
    function fit() {
      const w = 390 + 12 + 8;
      const h = 844 + 12 + 8;
      const scale = Math.min(1, (window.innerWidth - 32) / w, (window.innerHeight - 32) / h);
      stage.style.transform = `scale(${scale})`;
    }

    function tick() {
      const now = new Date();
      clock.textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    // iOS scrollbars overlay the content; hide the desktop ones so the app keeps its full 390px width.
    app.addEventListener('load', () => {
      try {
        const doc = app.contentDocument;
        const style = doc.createElement('style');
        style.textContent = 'html, body, * { scrollbar-width: none; } ::-webkit-scrollbar { display: none; }';
        doc.head.appendChild(style);
        document.title = `${doc.title} · iPhone 14`;
      } catch (e) { /* cross-origin (e.g. opened from file://): leave scrollbars as they are */ }
    });

    // The app asks for a status bar colour that matches what is under it (dimmed by dialogs, black behind sheets).
    const statusBar = document.querySelector('.status-bar');
    window.addEventListener('message', (e) => {
      if (e.source !== app.contentWindow || !e.data || e.data.type !== 'hvs-statusbar') return;
      statusBar.style.backgroundColor = e.data.bg;
      statusBar.style.color = e.data.bg === '#000000' ? '#fff' : '#000';
      statusBar.querySelectorAll('svg').forEach((svg) => { svg.style.filter = e.data.bg === '#000000' ? 'invert(1)' : ''; });
    });
    app.addEventListener('load', () => {
      if (!/app.html/.test(app.contentWindow.location.pathname)) statusBar.style.backgroundColor = '#fff';
    });

    window.addEventListener('resize', fit);
    fit();
    tick();
    setInterval(tick, 10000);
  </script>
</body>

</html>
